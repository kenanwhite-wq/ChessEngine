<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Play Chess</title>
    <link rel="stylesheet" href="../chessboardjs-1/css/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: sans-serif;
            margin: 24px;
        }

        #board1 {
            max-width:  min(80vw, 480px);
        }

        button {
            margin: 12px 8px 0 0;
            padding: 8px 12px;
        }

        .settings {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
        }

        .setting {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #status {
            min-height: 1.5em;
        }
    </style>
</head>
<body>
    <h1>Chess vs. Bot</h1>
    <div id="board1" style="width: 480px"></div>
    <button id="startBtn" type="button">New Game</button>
    <button id="FisherBtn" type="button">Random Back Rank</button>
    <div class="settings">
        <label class="setting" for="playerColor">
            Play as
            <select id="playerColor">
                <option value="w">White</option>
                <option value="b">Black</option>
            </select>
        </label>
        <label class="setting" for="depth">
            Bot depth
            <input id="depth" type="range" min="1" max="8" value="3">
            <output id="depthValue" for="depth">3</output>
        </label>
    </div>
    <p id="status" role="status" aria-live="polite">Loading chess engine…</p>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="../chessboardjs-1/js/chess.min.js"></script>
    <script src="../chessboardjs-1/js/chessboard-1.0.0.js"></script>
    <script>
        var START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
        var game = new Chess(START_FEN);
        var board1;
        var playerColor = 'w';
        var engineReady = false;
        var botThinking = false;
        var requestId = 0;
        var activeRequestId = 0;
        var engine = new Worker('Worker.js');

        function updateStatus(message) {
            if (message) {
                $('#status').text(message);
                return;
            }

            var moveColor = game.turn() === 'w' ? 'White' : 'Black';
            if (game.in_checkmate()) {
                $('#status').text('Game over, ' + moveColor + ' is in checkmate.');
            } else if (game.in_draw()) {
                $('#status').text('Game over, drawn position.');
            } else if (botThinking) {
                $('#status').text((playerColor === 'w' ? 'Black' : 'White') + ' is thinking…');
            } else {
                var status = (game.turn() === playerColor ? 'Your' : 'Bot') + ' turn (' +
                    moveColor + ')';
                if (game.in_check()) status += ', ' + moveColor + ' is in check';
                $('#status').text(status);
            }
        }

        function onDragStart(source, piece) {
            if (botThinking || game.game_over() || game.turn() !== playerColor) return false;
            if (piece.charAt(0) !== playerColor) return false;
        }

        function requestBotMove() {
            if (!engineReady || game.game_over() || game.turn() === playerColor) return;
            botThinking = true;
            activeRequestId = ++requestId;
            updateStatus();
            engine.postMessage({
                id: activeRequestId,
                fen: game.fen(),
                depth: Number($('#depth').val())
            });
        }

        function onDrop(source, target) {
            if (game.turn() !== playerColor || botThinking) return 'snapback';
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });
            if (move === null) return 'snapback';
            updateStatus();
            if (!game.game_over()) {
                requestBotMove();
            }
        }

        function onSnapEnd() {
            board1.position(game.fen());
        }

        function resetGame(fen) {
            ++requestId;
            activeRequestId = 0;
            botThinking = false;
            playerColor = $('#playerColor').val();
            START_FEN = fen;
            if (!game.load(fen)) {
                updateStatus('Could not load that starting position.');
                return;
            }
            board1.orientation(playerColor === 'w' ? 'white' : 'black');
            board1.position(game.fen());
            updateStatus();
            requestBotMove();
        }

        function startingFen(placement, castling) {
            return placement + ' w ' + castling + ' - 0 1';
        }

        function shuffle(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }

        function fisherRandomPosition() {
            var whitePieces = shuffle(['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']);
            var blackPieces = shuffle(['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']);
            var boardPart = blackPieces.join('') +
                '/pppppppp/8/8/8/8/PPPPPPPP/' + whitePieces.join('');
            return boardPart + ' w - - 0 1';
        }

        board1 = Chessboard('board1', {
            position: START_FEN,
            draggable: true,
            pieceTheme: '../chessboardjs-1/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        });

        $('#startBtn').on('click', function () {
            resetGame(startingFen(
                'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR',
                'KQkq'
            ));
        });

        $('#FisherBtn').on('click', function () {
            resetGame(fisherRandomPosition());
        });

        $('#playerColor').on('change', function () {
            playerColor = $(this).val();
            $('#startBtn').trigger('click');
        });

        $('#depth').on('input', function () {
            $('#depthValue').text($(this).val());
        });

        engine.onmessage = function (event) {
            var data = event.data;
            if (data.type === 'ready') {
                engineReady = true;
                updateStatus();
                return;
            }
            if (data.type === 'error') {
                if (data.id === activeRequestId) {
                    botThinking = false;
                    updateStatus('Engine error: ' + data.message);
                }
                return;
            }
            if (data.type !== 'move' || data.id !== activeRequestId) return;
            if (data.fen !== game.fen() || game.turn() === playerColor) return;

            botThinking = false;
            var uci = data.move;
            if (!uci || uci === '0000') {
                updateStatus('The engine returned no move. Please start a new game.');
                return;
            }

            var move = game.move({
                from: uci.slice(0, 2),
                to: uci.slice(2, 4),
                promotion: uci.length > 4 ? uci.charAt(4) : 'q'
            });
            if (move === null) {
                updateStatus('Engine returned an illegal move (' + uci + '). Please start a new game.');
                return;
            }
            board1.position(game.fen());
            updateStatus();
        };

        engine.onerror = function (event) {
            botThinking = false;
            updateStatus('Could not load the chess engine: ' + event.message);
        };

        $('#playerColor').val(playerColor);
        updateStatus('Loading chess engine…');
    </script>
</body>
</html>
